<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Cấm zoom bằng meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Luyện Phát Âm Tiếng Trung</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Cấm chọn văn bản (bôi đen) khi chạm liên tục */
            -webkit-user-select: none;
            user-select: none;
            /* Ngăn kéo thả làm mới trang trên mobile */
            overscroll-behavior-y: none; 
            /* CẤM HÀNH VI ZOOM KHI DOUBLE-TAP */
            touch-action: manipulation; 
        }

        /* 2 vùng chạm điều hướng: tắt hiệu ứng highlight mặc định của trình duyệt web mobile */
        .tap-zone {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* CỐ ĐỊNH LAYOUT: Kích thước và font-size không đổi để tránh nhảy chữ */
        .sound-card {
            width: 85px;
            height: 85px;
            font-size: 3.5rem;
            line-height: 1;
            transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
        }
        @media (min-width: 768px) {
            .sound-card {
                width: 150px;
                height: 150px;
                font-size: 5.5rem;
            }
        }

        /* Khi kéo camera, không cho phép trình duyệt cuộn hay làm hành động khác */
        .touch-none-custom {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- THANH CÔNG CỤ (Z-INDEX CAO NHẤT) -->
    <div class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur shadow-sm z-50 px-3 py-3 flex items-center justify-between border-b border-gray-200">
        
        <!-- Nhóm Menu và Tiến độ -->
        <div class="flex items-center gap-3">
            <select id="mode-select" onchange="changeMode()" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm font-semibold text-gray-700 bg-gray-50 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 max-w-[160px] md:max-w-xs">
                <option value="1">1. Phụ âm</option>
                <option value="2">2. Toàn bộ nguyên âm</option>
                <option value="3">3. Phụ âm & Nguyên âm</option>
            </select>
            
            <div class="text-sm font-bold text-gray-800 whitespace-nowrap bg-gray-100 px-3 py-1.5 rounded-lg shadow-inner">
                <span id="progress-text" class="text-red-600">1 / 1</span>
            </div>
        </div>

        <!-- Nhóm Nút Camera -->
        <div>
            <button id="cam-toggle-btn" onclick="toggleCamera()" class="px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-xl shadow-md active:bg-blue-700 transition-colors whitespace-nowrap">
                Bật Camera
            </button>
        </div>
    </div>

    <!-- VÙNG CHẠM ĐIỀU HƯỚNG (NẰM DƯỚI THANH TOP, TRÊN KHU VỰC HIỂN THỊ) -->
    <div class="absolute inset-0 z-10 flex tap-zone pt-16">
        <!-- 1/3 Bên Trái: Lùi -->
        <div class="w-1/3 h-full cursor-pointer" onclick="prevItem()"></div>
        <!-- 2/3 Bên Phải: Tiến -->
        <div class="w-2/3 h-full cursor-pointer" onclick="nextItem()"></div>
    </div>

    <!-- KHU VỰC HIỂN THỊ NỘI DUNG CHÍNH -->
    <div class="relative z-0 flex-1 flex flex-col items-center justify-start pt-24 md:pt-28 px-4 pb-10 pointer-events-none">
        
        <!-- Tiêu đề nhóm -->
        <div class="text-center mb-6 md:mb-10 w-full px-2">
            <h1 id="group-title" class="text-2xl md:text-4xl font-extrabold text-gray-800 leading-tight">
                Tiêu đề
            </h1>
        </div>

        <!-- Lưới chứa các chữ cái -->
        <div id="sound-grid" class="w-full max-w-4xl flex flex-wrap justify-center content-start gap-3 md:gap-6">
            <!-- Render từ Javascript -->
        </div>

        <!-- Chú thích hướng dẫn (ẩn đi khi bắt đầu chạm để cho gọn) -->
        <div id="hint-text" class="mt-auto pointer-events-auto text-gray-400 text-[11px] md:text-sm font-medium">
            Chạm bên trái để lùi | Chạm bên phải để tiến
        </div>
    </div>

    <!-- KHUNG CAMERA (Có thể di chuyển & thay đổi kích thước) -->
    <!-- Bo tròn mượt mà, đổ bóng sâu, không viền nét đứt -->
    <div id="camera-box" class="fixed top-20 right-4 w-32 h-44 md:w-48 md:h-64 bg-black rounded-2xl overflow-hidden shadow-2xl z-50 flex flex-col hidden touch-none-custom cursor-move ring-4 ring-white/50">
        
        <!-- Video Stream (Chiếm toàn bộ khung, có thể bấm vào để kéo) -->
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1] pointer-events-none"></video>
        
        <!-- Handle thay đổi kích thước (Resize) ở góc dưới cùng bên phải -->
        <!-- Sự kiện kéo giãn sẽ được chặn nổi bọt để không dính với sự kiện di chuyển camera -->
        <div id="resize-handle" class="absolute bottom-0 right-0 w-8 h-8 cursor-se-resize touch-none-custom flex items-end justify-end p-1 z-10" onmousedown="startResize(event)" ontouchstart="startResize(event)">
            <!-- Icon góc tam giác -->
            <svg class="w-5 h-5 text-white drop-shadow-md pointer-events-none opacity-70" fill="currentColor" viewBox="0 0 24 24"><path d="M22 22H10L22 10V22Z"></path></svg>
        </div>
    </div>

    <!-- MÃ JAVASCRIPT -->
    <script>
        // --- 1. DỮ LIỆU ĐƯỢC CHUẨN HOÁ ---
        const DATA_CONSONANTS = [
            { title: "Phụ âm - Nhóm 1 (Hai môi & răng môi)", items: ["b", "p", "m", "f"] },
            { title: "Phụ âm - Nhóm 2 (Đầu lưỡi)", items: ["d", "t", "l", "n"] },
            { title: "Phụ âm - Nhóm 3 (Mặt lưỡi trước)", items: ["j", "q", "x"] },
            { title: "Phụ âm - Nhóm 4 (Cuống lưỡi)", items: ["g", "k", "h"] },
            { title: "Phụ âm - Nhóm 5 (Đầu lưỡi trước)", items: ["z", "c", "s"] },
            { title: "Phụ âm - Nhóm 6 (Uốn lưỡi)", items: ["zh", "ch", "sh", "r"] }
        ];

        const DATA_VOWELS = [
            { title: "Nguyên âm - Nhóm 1 (Đơn)", items: ["a", "o", "e", "i", "u", "ü"] },
            { title: "Nguyên âm - Nhóm 2 (Kép 1)", items: ["ao", "ai", "ou", "ei"] },
            { title: "Nguyên âm - Nhóm 3 (Kép 2)", items: ["ia", "ie", "iu", "ua", "uo", "ui", "üe"] },
            { title: "Nguyên âm - Nhóm 4 (Kép 3)", items: ["an", "en", "in", "un", "ün", "ang", "ong", "eng", "ing"] },
            { title: "Nguyên âm - Nhóm 5 (Kép 4)", items: ["iao", "ian", "iang", "iong", "uai", "uan", "uang", "ueng", "üan"] },
            { title: "Nguyên âm - Nhóm Đặc biệt", items: ["er"] }
        ];

        // Biến trạng thái
        let currentData = [];
        let currentSlideIndex = 0;
        let currentItemIndex = 0;

        const groupTitle = document.getElementById('group-title');
        const soundGrid = document.getElementById('sound-grid');
        const progressText = document.getElementById('progress-text');
        const modeSelect = document.getElementById('mode-select');

        // --- 2. LÔ-GIC ĐIỀU HƯỚNG VÀ RENDER ---
        
        function changeMode() {
            const mode = modeSelect.value;
            if (mode === "1") {
                currentData = [...DATA_CONSONANTS];
            } else if (mode === "2") {
                currentData = [...DATA_VOWELS];
            } else if (mode === "3") {
                currentData = [...DATA_CONSONANTS, ...DATA_VOWELS];
            }
            
            // Reset về slide và item đầu tiên
            currentSlideIndex = 0;
            currentItemIndex = 0;
            renderView();
        }

        function renderView() {
            if (currentData.length === 0) return;
            
            const slide = currentData[currentSlideIndex];
            groupTitle.innerText = slide.title;
            progressText.innerText = `${currentSlideIndex + 1} / ${currentData.length}`;
            
            soundGrid.innerHTML = '';
            
            slide.items.forEach((soundText, index) => {
                const div = document.createElement('div');
                div.innerText = soundText;
                
                // Lớp CSS mặc định
                let baseClasses = 'sound-card flex items-center justify-center font-bold rounded-2xl border-2 ';
                
                if (index === currentItemIndex) {
                    // TRẠNG THÁI ACTIVE: Nền vàng, chữ đỏ đậm, viền ẩn, đổ bóng mạnh
                    baseClasses += 'bg-[#ffeb3b] text-[#d32f2f] border-transparent shadow-lg z-10 scale-100';
                } else {
                    // TRẠNG THÁI BÌNH THƯỜNG: Nền trắng, chữ đen, viền xám nhạt
                    baseClasses += 'bg-white text-gray-800 border-gray-100 shadow-sm z-0';
                }

                div.className = baseClasses;
                soundGrid.appendChild(div);
            });
        }

        function nextItem() {
            document.getElementById('hint-text').style.opacity = '0.3'; // Mờ dần HD khi dùng quen
            const slide = currentData[currentSlideIndex];
            if (currentItemIndex < slide.items.length - 1) {
                currentItemIndex++; 
            } else if (currentSlideIndex < currentData.length - 1) {
                currentSlideIndex++; 
                currentItemIndex = 0;
            }
            renderView();
        }

        function prevItem() {
            if (currentItemIndex > 0) {
                currentItemIndex--; 
            } else if (currentSlideIndex > 0) {
                currentSlideIndex--; 
                currentItemIndex = currentData[currentSlideIndex].items.length - 1;
            }
            renderView();
        }

        // Hỗ trợ thêm phím cứng trên máy tính
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextItem();
            }
            if (e.code === 'ArrowLeft') {
                prevItem();
            }
        });


        // --- 3. LÔ-GIC CAMERA ---
        let stream = null;
        const cameraBox = document.getElementById('camera-box');
        const videoEl = document.getElementById('webcam');
        const camToggleBtn = document.getElementById('cam-toggle-btn');
        let isCameraOn = false;

        async function toggleCamera() {
            if (isCameraOn) {
                // TẮT CAMERA
                if (stream) stream.getTracks().forEach(track => track.stop());
                videoEl.srcObject = null;
                cameraBox.classList.add('hidden');
                
                camToggleBtn.innerText = "Bật Camera";
                camToggleBtn.classList.replace('bg-red-600', 'bg-blue-600');
                isCameraOn = false;
            } else {
                // BẬT CAMERA
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    videoEl.srcObject = stream;
                    cameraBox.classList.remove('hidden');
                    
                    camToggleBtn.innerText = "Tắt Camera";
                    camToggleBtn.classList.replace('bg-blue-600', 'bg-red-600');
                    isCameraOn = true;
                } catch (err) {
                    alert("Không thể truy cập camera. Vui lòng cấp quyền (Allow) máy ảnh cho trang web này.");
                    console.error(err);
                }
            }
        }

        // --- 4. DRAG & DROP CAMERA (KÉO THẢ) ---
        let isDragging = false;
        let dragStartX, dragStartY, initialLeft, initialTop;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
            
            const rect = cameraBox.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            // Chuyển vị trí về Left/Top tuyệt đối
            cameraBox.style.bottom = 'auto';
            cameraBox.style.right = 'auto';
            cameraBox.style.left = `${initialLeft}px`;
            cameraBox.style.top = `${initialTop}px`;
            
            e.preventDefault();
        }

        function onDrag(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;
            
            cameraBox.style.left = `${initialLeft + dx}px`;
            cameraBox.style.top = `${initialTop + dy}px`;
        }

        function endDrag() { isDragging = false; }

        // Gắn sự kiện drag vào toàn bộ box camera
        cameraBox.addEventListener('mousedown', startDrag);
        cameraBox.addEventListener('touchstart', startDrag, {passive: false});
        
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // --- 5. RESIZE CAMERA (THAY ĐỔI KÍCH THƯỚC) ---
        let isResizing = false;
        let resizeStartX, resizeStartY, initialWidth, initialHeight;

        // Sự kiện startResize được gắn trực tiếp trên thẻ HTML của resize-handle
        function startResize(e) {
            isResizing = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            resizeStartX = clientX;
            resizeStartY = clientY;
            
            const rect = cameraBox.getBoundingClientRect();
            initialWidth = rect.width;
            initialHeight = rect.height;
            
            // CHẶN BỌT SỰ KIỆN: Ngăn sự kiện chạm lan ra khung camera gây kéo (drag)
            e.preventDefault();
            e.stopPropagation();
        }

        function onResize(e) {
            if (!isResizing) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - resizeStartX;
            const dy = clientY - resizeStartY;
            
            // Cập nhật Width và Height, có giới hạn kích thước tối thiểu
            cameraBox.style.width = `${Math.max(100, initialWidth + dx)}px`;
            cameraBox.style.height = `${Math.max(120, initialHeight + dy)}px`;
            
            e.stopPropagation();
        }

        function endResize(e) { 
            if (isResizing) {
                isResizing = false; 
                e.stopPropagation();
            }
        }

        window.addEventListener('mousemove', onResize);
        window.addEventListener('touchmove', onResize, {passive: false});
        window.addEventListener('mouseup', endResize);
        window.addEventListener('touchend', endResize);

        // --- KHỞI CHẠY LẦN ĐẦU ---
        window.onload = () => {
            changeMode(); // Khởi tạo dữ liệu và view ban đầu
        };
    </script>
</body>
</html>
