<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luyện Phát Âm Tiếng Trung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .sound-card {
      min-width: 85px;
      height: 85px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      font-weight: 700;
      color: #1f2937;
      background-color: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 1rem;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }
    @media (min-width: 768px) {
      .sound-card {
        min-width: 150px;
        height: 150px;
        padding: 0 24px;
        font-size: 4rem;
        border-radius: 1.5rem;
      }
    }
    .sound-card.active {
      background-color: #ffeb3b !important;
      color: #d32f2f !important;
      border-color: #fbc02d !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    #camera-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 140px;
      height: 190px;
      z-index: 50;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      background: #000;
      touch-action: none;
    }
    @media (min-width: 768px) {
      #camera-container {
        width: 220px;
        height: 290px;
        bottom: 40px;
        right: 40px;
      }
    }
    #resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 28px;
      height: 28px;
      z-index: 60;
      touch-action: none;
    }
    /* Các bộ lọc làm đẹp */
    .filter-none {
      filter: none;
    }
    .filter-smooth {
      filter: brightness(1.08) contrast(0.92) saturate(1.08);
    }
    .filter-warm {
      filter: brightness(1.06) contrast(0.95) saturate(1.15) sepia(0.08);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] h-screen w-screen overflow-hidden flex flex-col justify-between font-sans relative">

  <!-- VÙNG ĐIỀU HƯỚNG 1/3 (LÙI) VÀ 2/3 (TIẾN) -->
  <div class="absolute inset-0 flex z-30 pointer-events-auto">
    <div id="tap-prev" class="w-1/3 h-full cursor-pointer"></div>
    <div id="tap-next" class="w-2/3 h-full cursor-pointer"></div>
  </div>

  <!-- MENU ĐIỀU KHIỂN PHÍA TRÊN -->
  <header class="p-4 flex justify-between items-center z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="flex items-center gap-2">
      <select id="mode-select" class="bg-gray-100 border border-gray-300 text-gray-800 text-sm font-bold rounded-lg px-3 py-2 outline-none">
        <option value="consonants">1. Phụ âm</option>
        <option value="vowels">2. Toàn bộ Nguyên âm</option>
        <option value="both">3. Phụ âm & Nguyên âm</option>
      </select>
      <span id="slide-info" class="text-xs font-semibold text-gray-500 hidden sm:inline"></span>
    </div>

    <div class="flex items-center gap-2">
      <!-- Nút đổi Filter làm đẹp -->
      <button id="filter-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
        <span>✨</span> <span id="filter-label">Filter: Gốc</span>
      </button>
      <!-- Nút bật/tắt Camera -->
      <button id="toggle-cam-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg shadow transition">
        Bật Camera
      </button>
    </div>
  </header>

  <!-- KHU VỰC HIỂN THỊ NỘI DUNG PHÁT ÂM -->
  <main class="flex-1 flex flex-col justify-center items-center px-4 z-20">
    <div class="text-center mb-6">
      <span id="badge" class="inline-block px-4 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wider uppercase mb-2 bg-blue-100 text-blue-800">
        Phụ âm
      </span>
      <h1 id="group-title" class="text-xl sm:text-3xl font-bold text-gray-800">Nhóm 1</h1>
    </div>

    <!-- Hàng thẻ phát âm -->
    <div id="sounds-container" class="flex flex-wrap justify-center items-center gap-3 sm:gap-6 max-w-4xl">
      <!-- Thẻ sẽ được render tại đây -->
    </div>
  </main>

  <!-- THANH TIẾN ĐỘ VÀ PHÍM ĐIỀU HƯỚNG DƯỚI CÙNG -->
  <footer class="p-4 z-40 bg-white/80 backdrop-blur border-t border-gray-200 flex flex-col gap-2">
    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
      <div id="progress-bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="flex justify-between items-center text-xs text-gray-500">
      <span class="text-gray-400">Chạm 1/3 bên trái để lùi • 2/3 bên phải để tiến</span>
      <div class="flex gap-2">
        <button id="btn-prev" class="px-3 py-1 bg-gray-100 rounded border hover:bg-gray-200">◀ Lùi</button>
        <button id="btn-next" class="px-3 py-1 bg-gray-100 rounded border hover:bg-gray-200">Tiến ▶</button>
      </div>
    </div>
  </footer>

  <!-- KHUNG CAMERA NỔI (KÉO THẢ VÀ ĐỔI KÍCH THƯỚC TRỰC TIẾP) -->
  <div id="camera-container" class="hidden">
    <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100 filter-none"></video>
    <div id="cam-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-xs text-center p-2">
      Đang tải camera...
    </div>
    <!-- Nút kéo góc dưới bên phải để chỉnh kích thước -->
    <div id="resize-handle">
      <svg class="w-full h-full text-white/70 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22 22H20V20H22V22ZM22 18H20V16H22V18ZM18 22H16V20H18V22ZM18 18H16V16H18V18ZM14 22H12V20H14V22ZM22 14H20V12H22V14Z" />
      </svg>
    </div>
  </div>

  <script>
    // Dữ liệu Phụ âm (6 nhóm)
    const CONSONANTS = [
      { badge: "Phụ âm", title: "Nhóm 1: Âm hai môi & răng môi", sounds: ["b", "p", "m", "f"] },
      { badge: "Phụ âm", title: "Nhóm 2: Âm đầu lưỡi", sounds: ["d", "t", "l", "n"] },
      { badge: "Phụ âm", title: "Nhóm 3: Âm mặt lưỡi trước", sounds: ["j", "q", "x"] },
      { badge: "Phụ âm", title: "Nhóm 4: Âm cuống lưỡi", sounds: ["g", "k", "h"] },
      { badge: "Phụ âm", title: "Nhóm 5: Âm đầu lưỡi trước", sounds: ["z", "c", "s"] },
      { badge: "Phụ âm", title: "Nhóm 6: Âm uốn lưỡi", sounds: ["zh", "ch", "sh", "r"] }
    ];

    // Dữ liệu Nguyên âm (6 nhóm đầy đủ)
    const VOWELS = [
      { badge: "Nguyên âm", title: "Nguyên âm đơn", sounds: ["a", "o", "e", "i", "u", "ü"] },
      { badge: "Nguyên âm", title: "Nguyên âm kép - Nhóm 1", sounds: ["ao", "ai", "ou", "ei"] },
      { badge: "Nguyên âm", title: "Nguyên âm kép - Nhóm 2", sounds: ["ia", "ie", "iu", "ua", "uo", "ui", "üe"] },
      { badge: "Nguyên âm", title: "Nguyên âm kép - Nhóm 3", sounds: ["an", "en", "in", "un", "ün", "ang", "ong", "eng", "ing"] },
      { badge: "Nguyên âm", title: "Nguyên âm kép - Nhóm 4", sounds: ["iao", "ian", "iang", "iong", "uai", "uan", "uang", "ueng", "üan"] },
      { badge: "Nguyên âm", title: "Nguyên âm đặc biệt", sounds: ["er", "-i (trước)", "-i (sau)"] }
    ];

    let currentDataSet = CONSONANTS;
    let groupIndex = 0;
    let soundIndex = 0;

    const groupTitle = document.getElementById('group-title');
    const badge = document.getElementById('badge');
    const soundsContainer = document.getElementById('sounds-container');
    const slideInfo = document.getElementById('slide-info');
    const progressBar = document.getElementById('progress-bar');
    const modeSelect = document.getElementById('mode-select');

    function renderSlide() {
      const currentGroup = currentDataSet[groupIndex];
      badge.textContent = currentGroup.badge;
      groupTitle.textContent = currentGroup.title;
      slideInfo.textContent = `Nhóm ${groupIndex + 1}/${currentDataSet.length}`;

      // Xóa thẻ cũ và dựng thẻ mới
      soundsContainer.innerHTML = '';
      currentGroup.sounds.forEach((sound, idx) => {
        const card = document.createElement('div');
        card.className = `sound-card ${idx === soundIndex ? 'active' : ''}`;
        card.textContent = sound;
        soundsContainer.appendChild(card);
      });

      updateProgress();
    }

    function updateActiveSoundOnly() {
      const cards = soundsContainer.querySelectorAll('.sound-card');
      cards.forEach((card, idx) => {
        if (idx === soundIndex) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
      updateProgress();
    }

    function updateProgress() {
      let totalSounds = 0;
      let pastSounds = 0;
      for (let i = 0; i < currentDataSet.length; i++) {
        totalSounds += currentDataSet[i].sounds.length;
        if (i < groupIndex) pastSounds += currentDataSet[i].sounds.length;
        else if (i === groupIndex) pastSounds += soundIndex + 1;
      }
      const pct = (pastSounds / totalSounds) * 100;
      progressBar.style.width = `${pct}%`;
    }

    function nextStep() {
      const currentGroup = currentDataSet[groupIndex];
      if (soundIndex < currentGroup.sounds.length - 1) {
        soundIndex++;
        updateActiveSoundOnly();
      } else {
        if (groupIndex < currentDataSet.length - 1) {
          groupIndex++;
          soundIndex = 0;
          renderSlide();
        }
      }
    }

    function prevStep() {
      if (soundIndex > 0) {
        soundIndex--;
        updateActiveSoundOnly();
      } else {
        if (groupIndex > 0) {
          groupIndex--;
          soundIndex = currentDataSet[groupIndex].sounds.length - 1;
          renderSlide();
        }
      }
    }

    // Xử lý chọn chế độ
    modeSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'consonants') currentDataSet = CONSONANTS;
      else if (val === 'vowels') currentDataSet = VOWELS;
      else if (val === 'both') currentDataSet = [...CONSONANTS, ...VOWELS];

      groupIndex = 0;
      soundIndex = 0;
      renderSlide();
    });

    // Vùng chạm màn hình
    document.getElementById('tap-prev').addEventListener('click', prevStep);
    document.getElementById('tap-next').addEventListener('click', nextStep);
    document.getElementById('btn-prev').addEventListener('click', prevStep);
    document.getElementById('btn-next').addEventListener('click', nextStep);

    // Bàn phím máy tính
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowRight') {
        e.preventDefault();
        nextStep();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        prevStep();
      }
    });

    // ==========================================
    // LOGIC FILTER LÀM ĐẸP CHO CAMERA
    // ==========================================
    const filters = [
      { name: "Gốc", class: "filter-none" },
      { name: "Sáng mịn", class: "filter-smooth" },
      { name: "Hồng hào", class: "filter-warm" }
    ];
    let currentFilterIndex = 0;
    const filterBtn = document.getElementById('filter-btn');
    const filterLabel = document.getElementById('filter-label');
    const webcamVideo = document.getElementById('webcam');

    filterBtn.addEventListener('click', () => {
      // Xóa class filter hiện tại
      webcamVideo.classList.remove(filters[currentFilterIndex].class);
      
      // Chuyển sang filter tiếp theo
      currentFilterIndex = (currentFilterIndex + 1) % filters.length;
      
      // Thêm class filter mới
      webcamVideo.classList.add(filters[currentFilterIndex].class);
      filterLabel.textContent = `Filter: ${filters[currentFilterIndex].name}`;
    });

    // ==========================================
    // QUẢN LÝ WEBCAM
    // ==========================================
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const cameraContainer = document.getElementById('camera-container');
    const webcam = document.getElementById('webcam');
    const camPlaceholder = document.getElementById('cam-placeholder');
    let stream = null;

    toggleCamBtn.addEventListener('click', async () => {
      if (!stream) {
        try {
          cameraContainer.classList.remove('hidden');
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
          webcam.srcObject = stream;
          camPlaceholder.style.display = 'none';
          toggleCamBtn.textContent = 'Tắt Camera';
          toggleCamBtn.classList.replace('bg-blue-600', 'bg-red-600');
        } catch (err) {
          alert('Không thể mở Camera. Vui lòng cấp quyền máy ảnh và sử dụng kết nối HTTPS.');
          cameraContainer.classList.add('hidden');
        }
      } else {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        webcam.srcObject = null;
        cameraContainer.classList.add('hidden');
        toggleCamBtn.textContent = 'Bật Camera';
        toggleCamBtn.classList.replace('bg-red-600', 'bg-blue-600');
      }
    });

    // ==========================================
    // KÉO THẢ CAMERA TỰ DO VÀ ĐỔI KÍCH THƯỚC
    // ==========================================
    let isDragging = false;
    let isResizing = false;
    let startX, startY, initLeft, initTop, initWidth, initHeight;

    cameraContainer.addEventListener('touchstart', onTouchStart, { passive: false });
    cameraContainer.addEventListener('mousedown', onMouseDown);

    function onMouseDown(e) {
      if (e.target.closest('#resize-handle')) {
        startResize(e.clientX, e.clientY);
      } else {
        startDrag(e.clientX, e.clientY);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onEnd);
    }

    function onTouchStart(e) {
      const touch = e.touches[0];
      if (e.target.closest('#resize-handle')) {
        startResize(touch.clientX, touch.clientY);
      } else {
        startDrag(touch.clientX, touch.clientY);
      }
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    function startDrag(x, y) {
      isDragging = true;
      startX = x;
      startY = y;
      const rect = cameraContainer.getBoundingClientRect();
      initLeft = rect.left;
      initTop = rect.top;
      cameraContainer.style.bottom = 'auto';
      cameraContainer.style.right = 'auto';
      cameraContainer.style.left = `${initLeft}px`;
      cameraContainer.style.top = `${initTop}px`;
    }

    function startResize(x, y) {
      isResizing = true;
      startX = x;
      startY = y;
      const rect = cameraContainer.getBoundingClientRect();
      initWidth = rect.width;
      initHeight = rect.height;
    }

    function onMouseMove(e) {
      handleMove(e.clientX, e.clientY);
    }

    function onTouchMove(e) {
      e.preventDefault();
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }

    function handleMove(x, y) {
      if (isDragging) {
        const dx = x - startX;
        const dy = y - startY;
        cameraContainer.style.left = `${initLeft + dx}px`;
        cameraContainer.style.top = `${initTop + dy}px`;
      } else if (isResizing) {
        const dx = x - startX;
        const dy = y - startY;
        const newW = Math.max(90, initWidth + dx);
        const newH = Math.max(120, initHeight + dy);
        cameraContainer.style.width = `${newW}px`;
        cameraContainer.style.height = `${newH}px`;
      }
    }

    function onEnd() {
      isDragging = false;
      isResizing = false;
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onEnd);
    }

    // Khởi chạy slide đầu tiên
    renderSlide();
  </script>
</body>
</html>
