
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport chuẩn cho thiết bị di động, chống zoom thủ công để không hỏng layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Phát Âm (Bản Mobile)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Ngăn chặn hành vi bôi đen text khi chạm liên tục trên điện thoại */
            -webkit-user-select: none;
            user-select: none;
            /* Ngăn cuộn trang rác trên mobile */
            overscroll-behavior-y: none;
        }
        .sound-card {
            transition: all 0.25s ease-out;
        }
        /* Tap zones feedback (không màu, chỉ dùng để bắt sự kiện) */
        .tap-zone {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden flex flex-col relative selection:bg-transparent">

    <!-- Thanh Progress Bar -->
    <div class="w-full bg-gray-200 h-1.5 z-50">
        <div id="progress-bar" class="bg-red-500 h-1.5 transition-all duration-500" style="width: 0%"></div>
    </div>

    <!-- KHU VỰC TAP TRÁI / PHẢI ẨN BÊN DƯỚI -->
    <div class="absolute inset-0 z-10 flex tap-zone pt-2">
        <div class="w-1/2 h-full" onclick="prevItem()"></div>
        <div class="w-1/2 h-full" onclick="nextItem()"></div>
    </div>

    <!-- KHU VỰC HIỂN THỊ CHÍNH (Nằm trên tap zone) -->
    <div class="flex-1 flex flex-col items-center justify-start pt-6 px-4 pb-20 relative z-20 pointer-events-none">
        
        <!-- Header -->
        <div class="text-center mb-6 w-full pointer-events-auto">
            <span id="category-badge" class="inline-block px-3 py-1 bg-red-100 text-red-700 font-bold rounded-full text-sm uppercase tracking-wide mb-2 shadow-sm">
                PHỤ ÂM
            </span>
            <h1 id="group-title" class="text-2xl font-extrabold text-gray-800 px-2 leading-tight">
                Nhóm 1
            </h1>
            <p id="progress-text" class="text-gray-500 text-xs font-medium mt-2">1 / 12</p>
        </div>

        <!-- Lưới chữ cái -->
        <div id="sound-grid" class="w-full flex flex-wrap justify-center content-start gap-3 mt-4 pointer-events-auto">
            <!-- Render từ JS -->
        </div>

        <!-- Hướng dẫn thao tác (Chỉ hiện lúc đầu) -->
        <div class="mt-auto mb-10 bg-white/80 backdrop-blur px-4 py-2 rounded-2xl shadow border border-gray-100 text-center text-sm text-gray-500 animate-pulse pointer-events-auto">
            👈 Chạm TRÁI để lùi | Chạm PHẢI để tiến 👉
        </div>
    </div>

    <!-- Nút Bật Camera (Hiện ra nếu camera chưa bật) -->
    <div id="camera-prompt" class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-xl font-bold mb-2 text-gray-800">Cấp quyền Camera</h2>
            <p class="text-sm text-gray-500 mb-6">Ứng dụng cần sử dụng camera trước để bạn có thể xem lại khẩu hình miệng của mình khi quay màn hình.</p>
            <button onclick="startCamera()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-95 transition-transform shadow-md">
                Cho phép Camera
            </button>
            <p id="cam-error" class="text-red-500 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- KHU VỰC CAMERA TRƯỚC (Nổi ở góc dưới bên phải) -->
    <div id="camera-container" class="fixed bottom-4 right-4 w-28 h-40 md:w-40 md:h-56 bg-gray-800 rounded-2xl overflow-hidden shadow-2xl border-[3px] border-white z-50 transition-transform duration-300 hidden">
        <!-- Thuộc tính playsinline RẤT QUAN TRỌNG cho iOS để không bị phóng to toàn màn hình -->
        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Dữ liệu bóc tách từ tài liệu
        const slidesData = [
            { category: "PHỤ ÂM", title: "Nhóm 1 (Hai môi & răng môi)", items: ["b", "p", "m", "f"] },
            { category: "PHỤ ÂM", title: "Nhóm 2 (Đầu lưỡi)", items: ["d", "t", "l", "n"] },
            { category: "PHỤ ÂM", title: "Nhóm 3 (Mặt lưỡi trước)", items: ["j", "q", "x"] },
            { category: "PHỤ ÂM", title: "Nhóm 4 (Cuống lưỡi)", items: ["g", "k", "h"] },
            { category: "PHỤ ÂM", title: "Nhóm 5 (Đầu lưỡi trước)", items: ["z", "c", "s"] },
            { category: "PHỤ ÂM", title: "Nhóm 6 (Uốn lưỡi)", items: ["zh", "ch", "sh", "r"] },
            
            { category: "NGUYÊN ÂM", title: "Nguyên âm đơn", items: ["a", "o", "e", "i", "u", "ü"] },
            { category: "NGUYÊN ÂM", title: "Nguyên âm kép nhóm 1", items: ["ao", "ai", "ou", "ei"] },
            { category: "NGUYÊN ÂM", title: "Nguyên âm kép nhóm 2", items: ["ia", "ie", "iu", "ua", "uo", "ui", "üe"] },
            { category: "NGUYÊN ÂM", title: "Nguyên âm kép nhóm 3", items: ["an", "en", "in", "un", "ün", "ang", "ong", "eng", "ing"] },
            { category: "NGUYÊN ÂM", title: "Nguyên âm kép nhóm 4", items: ["iao", "ian", "iang", "iong", "uai", "uan", "uang", "ueng", "üan"] },
            { category: "NGUYÊN ÂM", title: "Nguyên âm đặc biệt", items: ["er"] }
        ];

        let currentSlideIndex = 0;
        let currentItemIndex = 0;

        const categoryBadge = document.getElementById('category-badge');
        const groupTitle = document.getElementById('group-title');
        const soundGrid = document.getElementById('sound-grid');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        
        // Cấp quyền và bật Camera
        async function startCamera() {
            const camError = document.getElementById('cam-error');
            try {
                // Yêu cầu camera trước, không cần audio vì trình quay màn hình sẽ bắt mic riêng
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                
                const videoEl = document.getElementById('webcam');
                videoEl.srcObject = stream;
                
                // Ẩn bảng yêu cầu, hiện khung camera nhỏ
                document.getElementById('camera-prompt').classList.add('hidden');
                document.getElementById('camera-container').classList.remove('hidden');
                
            } catch (err) {
                console.error("Lỗi camera: ", err);
                camError.innerText = "Không thể truy cập camera. Vui lòng kiểm tra quyền trên trình duyệt.";
                camError.classList.remove('hidden');
            }
        }

        function renderView() {
            const slide = slidesData[currentSlideIndex];
            
            categoryBadge.innerText = slide.category;
            if(slide.category === "PHỤ ÂM") {
                categoryBadge.className = "inline-block px-3 py-1 bg-blue-100 text-blue-700 font-bold rounded-full text-xs uppercase tracking-wide mb-2 shadow-sm";
            } else {
                categoryBadge.className = "inline-block px-3 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-full text-xs uppercase tracking-wide mb-2 shadow-sm";
            }

            groupTitle.innerText = slide.title;
            progressText.innerText = `Nhóm ${currentSlideIndex + 1} / ${slidesData.length}`;
            
            // Tính toán tiến trình
            let totalItems = 0;
            let passedItems = 0;
            for(let i=0; i<slidesData.length; i++) {
                totalItems += slidesData[i].items.length;
                if(i < currentSlideIndex) {
                    passedItems += slidesData[i].items.length;
                }
            }
            passedItems += (currentItemIndex + 1);
            let progressPercent = (passedItems / totalItems) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Render chữ
            soundGrid.innerHTML = '';
            slide.items.forEach((soundText, index) => {
                const div = document.createElement('div');
                div.innerText = soundText;
                
                // Mặc định CSS (responsive: chữ nhỏ hơn cho mobile)
                let baseClasses = 'sound-card flex items-center justify-center font-bold rounded-2xl px-4 py-3 min-w-[70px] md:min-w-[120px] ';
                
                if (index === currentItemIndex) {
                    // Active state: Chữ siêu to, nổi bật
                    baseClasses += 'text-[4.5rem] md:text-[6rem] text-red-600 bg-yellow-100 border-2 border-yellow-400 scale-110 shadow-xl z-10 opacity-100 mx-2 my-2';
                } else {
                    // Inactive state: Chữ nhỏ, làm mờ
                    baseClasses += 'text-[2.5rem] md:text-[4rem] text-gray-800 bg-white border border-gray-200 shadow-sm z-0 opacity-40';
                }

                div.className = baseClasses;
                soundGrid.appendChild(div);
            });
        }

        function nextItem() {
            const currentSlide = slidesData[currentSlideIndex];
            if (currentItemIndex < currentSlide.items.length - 1) {
                currentItemIndex++;
            } else if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                currentItemIndex = 0;
            }
            renderView();
        }

        function prevItem() {
            if (currentItemIndex > 0) {
                currentItemIndex--;
            } else if (currentSlideIndex > 0) {
                currentSlideIndex--;
                currentItemIndex = slidesData[currentSlideIndex].items.length - 1;
            }
            renderView();
        }

        // Bàn phím máy tính vẫn dùng được nếu cần
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextItem();
            }
            if (e.code === 'ArrowLeft') {
                prevItem();
            }
        });

        // Khởi chạy
        window.onload = () => {
            renderView();
        };

    </script>
</body>
</html>
