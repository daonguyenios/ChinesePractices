<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luyện Phát Âm Tiếng Trung</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior-y: none; /* Ngăn chặn pull-to-refresh trên mobile */
        }
        
        /* CỐ ĐỊNH LAYOUT: Kích thước và font-size không đổi để tránh nhảy chữ */
        .sound-card {
            width: 80px;
            height: 80px;
            font-size: 3rem;
            line-height: 1;
            transition: background-color 0.15s, color 0.15s, box-shadow 0.15s, border-color 0.15s;
        }
        @media (min-width: 768px) {
            .sound-card {
                width: 140px;
                height: 140px;
                font-size: 5rem;
            }
        }

        /* Ẩn highlight mặc định khi tap trên mobile */
        .tap-zone {
            -webkit-tap-highlight-color: transparent;
        }

        /* Vô hiệu hoá hành vi mặc định của touch khi đang kéo thả camera */
        .touch-none-custom {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden flex flex-col relative">

    <!-- THANH CÔNG CỤ (Z-INDEX CAO NHẤT ĐỂ KHÔNG BỊ VÙNG TAP CHE) -->
    <div class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur shadow-sm z-50 px-2 py-3 md:px-4 md:py-3 flex flex-col md:flex-row items-center justify-between gap-2 border-b border-gray-200">
        
        <!-- Nhóm Menu và Tiến độ -->
        <div class="flex items-center justify-between w-full md:w-auto gap-3">
            <select id="mode-select" onchange="changeMode()" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm font-semibold text-gray-700 bg-gray-50 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 max-w-[200px]">
                <option value="3">3. Phụ âm & Nguyên âm</option>
                <option value="1">1. Phụ âm (6 nhóm)</option>
                <option value="2">2. Nguyên âm gốc</option>
            </select>
            
            <div class="text-sm font-bold text-gray-800 whitespace-nowrap bg-gray-100 px-3 py-1.5 rounded-lg">
                <span id="progress-text" class="text-red-600">1 / 1</span>
            </div>
        </div>

        <!-- Nhóm Nút Camera -->
        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
            <button onclick="toggleCameraBorder()" class="flex-1 md:flex-none px-3 py-1.5 bg-gray-100 text-gray-700 text-xs font-semibold rounded-lg border border-gray-300 active:bg-gray-200 whitespace-nowrap">
                Ẩn/Hiện Viền
            </button>
            <button id="cam-toggle-btn" onclick="toggleCamera()" class="flex-1 md:flex-none px-3 py-1.5 bg-blue-600 text-white text-xs font-semibold rounded-lg shadow active:bg-blue-700 whitespace-nowrap transition-colors">
                Bật Camera
            </button>
        </div>
    </div>

    <!-- VÙNG CHẠM ĐIỀU HƯỚNG (NẰM DƯỚI THANH TOP, TRÊN KHU VỰC HIỂN THỊ) -->
    <!-- pt-28 (mobile) hoặc pt-16 (desktop) để chừa chỗ cho thanh menu ở trên -->
    <div class="absolute inset-0 z-10 flex tap-zone pt-28 md:pt-16">
        <!-- 1/3 Bên Trái: Lùi -->
        <div class="w-1/3 h-full cursor-pointer" onclick="prevItem()"></div>
        <!-- 2/3 Bên Phải: Tiến -->
        <div class="w-2/3 h-full cursor-pointer" onclick="nextItem()"></div>
    </div>

    <!-- KHU VỰC HIỂN THỊ NỘI DUNG CHÍNH -->
    <!-- pointer-events-none để tránh chặn thao tác của Vùng Chạm ở trên -->
    <div class="relative z-0 flex-1 flex flex-col items-center justify-start pt-32 md:pt-28 px-4 pb-10 pointer-events-none">
        
        <!-- Tiêu đề nhóm -->
        <div class="text-center mb-6 md:mb-10 w-full px-2">
            <h1 id="group-title" class="text-xl md:text-4xl font-extrabold text-gray-800 leading-tight">
                Tiêu đề
            </h1>
        </div>

        <!-- Lưới chứa các chữ cái -->
        <div id="sound-grid" class="w-full flex flex-wrap justify-center content-start gap-3 md:gap-6">
            <!-- Render từ Javascript -->
        </div>

        <!-- Chú thích hướng dẫn (ẩn trên màn hình nhỏ nếu cần, ở đây giữ lại) -->
        <div class="mt-auto pointer-events-auto bg-gray-200 text-gray-600 text-[10px] md:text-xs px-4 py-2 rounded-full font-medium shadow-sm">
            👈 Nhấn bên trái để lùi | Nhấn bên phải để tiến 👉
        </div>
    </div>

    <!-- KHUNG CAMERA (Có thể di chuyển & thay đổi kích thước) -->
    <!-- Mặc định ẩn (hidden), z-50 để luôn nổi lên trên cùng -->
    <div id="camera-box" class="fixed bottom-6 right-4 w-32 h-44 md:w-48 md:h-64 bg-gray-900 rounded-xl overflow-hidden shadow-2xl border-2 border-dashed border-gray-400 z-50 flex flex-col hidden touch-none-custom">
        
        <!-- Handle di chuyển -->
        <div id="drag-handle" class="w-full bg-gray-200/90 text-[10px] md:text-xs font-bold text-center text-gray-600 py-1.5 cursor-move touch-none-custom flex items-center justify-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
            Kéo để di chuyển
        </div>
        
        <!-- Video Stream -->
        <video id="webcam" autoplay playsinline muted class="w-full flex-1 object-cover transform scale-x-[-1] pointer-events-none bg-black"></video>
        
        <!-- Handle thay đổi kích thước (Resize) -->
        <div id="resize-handle" class="absolute bottom-0 right-0 w-8 h-8 cursor-se-resize touch-none-custom flex items-end justify-end p-1">
            <svg class="w-4 h-4 text-white drop-shadow-md pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
        </div>
    </div>

    <!-- MÃ JAVASCRIPT -->
    <script>
        // --- 1. DỮ LIỆU ĐƯỢC CHUẨN HOÁ ---
        const DATA_CONSONANTS = [
            { title: "Phụ âm - Nhóm 1 (Hai môi & răng môi)", items: ["b", "p", "m", "f"] },
            { title: "Phụ âm - Nhóm 2 (Đầu lưỡi)", items: ["d", "t", "l", "n"] },
            { title: "Phụ âm - Nhóm 3 (Mặt lưỡi trước)", items: ["j", "q", "x"] },
            { title: "Phụ âm - Nhóm 4 (Cuống lưỡi)", items: ["g", "k", "h"] },
            { title: "Phụ âm - Nhóm 5 (Đầu lưỡi trước)", items: ["z", "c", "s"] },
            { title: "Phụ âm - Nhóm 6 (Uốn lưỡi)", items: ["zh", "ch", "sh", "r"] }
        ];

        const DATA_VOWELS = [
            { title: "Nguyên âm gốc", items: ["a", "o", "e", "i", "u", "ü"] }
        ];

        // Biến trạng thái
        let currentData = [];
        let currentSlideIndex = 0;
        let currentItemIndex = 0;

        const groupTitle = document.getElementById('group-title');
        const soundGrid = document.getElementById('sound-grid');
        const progressText = document.getElementById('progress-text');
        const modeSelect = document.getElementById('mode-select');

        // --- 2. LÔ-GIC ĐIỀU HƯỚNG VÀ RENDER ---
        
        // Đổi chế độ theo <select>
        function changeMode() {
            const mode = modeSelect.value;
            if (mode === "1") {
                currentData = [...DATA_CONSONANTS];
            } else if (mode === "2") {
                currentData = [...DATA_VOWELS];
            } else if (mode === "3") {
                currentData = [...DATA_CONSONANTS, ...DATA_VOWELS];
            }
            
            // Reset về slide và item đầu tiên
            currentSlideIndex = 0;
            currentItemIndex = 0;
            renderView();
        }

        // Render giao diện
        function renderView() {
            if (currentData.length === 0) return;
            
            const slide = currentData[currentSlideIndex];
            groupTitle.innerText = slide.title;
            progressText.innerText = `${currentSlideIndex + 1} / ${currentData.length}`;
            
            soundGrid.innerHTML = '';
            
            slide.items.forEach((soundText, index) => {
                const div = document.createElement('div');
                div.innerText = soundText;
                
                // Lớp CSS gốc (Kích thước được giữ cố định bởi class .sound-card)
                let baseClasses = 'sound-card flex items-center justify-center font-bold rounded-2xl border-2 ';
                
                if (index === currentItemIndex) {
                    // TRẠNG THÁI ACTIVE: Nền vàng, chữ đỏ đậm, viền vàng sậm, bóng nhẹ
                    baseClasses += 'bg-[#ffeb3b] text-[#d32f2f] border-[#fbc02d] shadow-md z-10';
                } else {
                    // TRẠNG THÁI BÌNH THƯỜNG: Nền trắng, chữ đen nhạt, viền xám
                    baseClasses += 'bg-white text-gray-800 border-gray-200 z-0';
                }

                div.className = baseClasses;
                soundGrid.appendChild(div);
            });
        }

        function nextItem() {
            const slide = currentData[currentSlideIndex];
            if (currentItemIndex < slide.items.length - 1) {
                currentItemIndex++; // Nhảy sang chữ tiếp theo trong nhóm
            } else if (currentSlideIndex < currentData.length - 1) {
                currentSlideIndex++; // Sang nhóm tiếp theo
                currentItemIndex = 0;
            }
            renderView();
        }

        function prevItem() {
            if (currentItemIndex > 0) {
                currentItemIndex--; // Lùi chữ trong nhóm
            } else if (currentSlideIndex > 0) {
                currentSlideIndex--; // Lùi về nhóm trước
                currentItemIndex = currentData[currentSlideIndex].items.length - 1;
            }
            renderView();
        }

        // Hỗ trợ thêm phím cứng trên máy tính
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                nextItem();
            }
            if (e.code === 'ArrowLeft') {
                prevItem();
            }
        });


        // --- 3. LÔ-GIC CAMERA ---
        let stream = null;
        const cameraBox = document.getElementById('camera-box');
        const videoEl = document.getElementById('webcam');
        const camToggleBtn = document.getElementById('cam-toggle-btn');
        let isCameraOn = false;
        let isBorderVisible = true;

        async function toggleCamera() {
            if (isCameraOn) {
                // TẮT CAMERA
                if (stream) stream.getTracks().forEach(track => track.stop());
                videoEl.srcObject = null;
                cameraBox.classList.add('hidden');
                
                camToggleBtn.innerText = "Bật Camera";
                camToggleBtn.classList.replace('bg-red-600', 'bg-blue-600');
                isCameraOn = false;
            } else {
                // BẬT CAMERA
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    videoEl.srcObject = stream;
                    cameraBox.classList.remove('hidden');
                    
                    camToggleBtn.innerText = "Tắt Camera";
                    camToggleBtn.classList.replace('bg-blue-600', 'bg-red-600');
                    isCameraOn = true;
                } catch (err) {
                    alert("Không thể truy cập camera. Vui lòng cấp quyền (Allow) máy ảnh cho trang web này.");
                    console.error(err);
                }
            }
        }

        function toggleCameraBorder() {
            if (isBorderVisible) {
                cameraBox.classList.remove('border-2', 'border-dashed', 'border-gray-400', 'shadow-2xl');
                cameraBox.classList.add('border-0', 'shadow-none');
            } else {
                cameraBox.classList.add('border-2', 'border-dashed', 'border-gray-400', 'shadow-2xl');
                cameraBox.classList.remove('border-0', 'shadow-none');
            }
            isBorderVisible = !isBorderVisible;
        }

        // --- 4. DRAG & DROP CAMERA (KÉO THẢ) ---
        const dragHandle = document.getElementById('drag-handle');
        let isDragging = false;
        let dragStartX, dragStartY, initialLeft, initialTop;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX;
            dragStartY = clientY;
            
            // Xóa position bottom/right nếu có, chuyển sang top/left tuyệt đối
            const rect = cameraBox.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            cameraBox.style.bottom = 'auto';
            cameraBox.style.right = 'auto';
            cameraBox.style.left = `${initialLeft}px`;
            cameraBox.style.top = `${initialTop}px`;
            
            e.preventDefault();
        }

        function onDrag(e) {
            if (!isDragging) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;
            
            cameraBox.style.left = `${initialLeft + dx}px`;
            cameraBox.style.top = `${initialTop + dy}px`;
        }

        function endDrag() { isDragging = false; }

        dragHandle.addEventListener('mousedown', startDrag);
        dragHandle.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // --- 5. RESIZE CAMERA (THAY ĐỔI KÍCH THƯỚC) ---
        const resizeHandle = document.getElementById('resize-handle');
        let isResizing = false;
        let resizeStartX, resizeStartY, initialWidth, initialHeight;

        function startResize(e) {
            isResizing = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            resizeStartX = clientX;
            resizeStartY = clientY;
            
            const rect = cameraBox.getBoundingClientRect();
            initialWidth = rect.width;
            initialHeight = rect.height;
            
            e.preventDefault();
            e.stopPropagation();
        }

        function onResize(e) {
            if (!isResizing) return;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const dx = clientX - resizeStartX;
            const dy = clientY - resizeStartY;
            
            // Giới hạn kích thước tối thiểu (100x120)
            cameraBox.style.width = `${Math.max(100, initialWidth + dx)}px`;
            cameraBox.style.height = `${Math.max(120, initialHeight + dy)}px`;
        }

        function endResize() { isResizing = false; }

        resizeHandle.addEventListener('mousedown', startResize);
        resizeHandle.addEventListener('touchstart', startResize, {passive: false});
        window.addEventListener('mousemove', onResize);
        window.addEventListener('touchmove', onResize, {passive: false});
        window.addEventListener('mouseup', endResize);
        window.addEventListener('touchend', endResize);

        // --- KHỞI CHẠY LẦN ĐẦU ---
        window.onload = () => {
            changeMode(); // Chạy hàm chọn menu mặc định
        };
    </script>
</body>
</html>
